<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gpBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ef763f" />
      <stop offset="50%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#007ff5" />
    </linearGradient>
  </defs>

  <!-- High-contrast brand squircle badge (vibrant against dark tabs and light tabs) -->
  <rect width="64" height="64" rx="18" fill="url(#gpBrandGrad)" />

  <!-- Code Chevron `<` -->
  <path d="M26 18L14 32L26 46" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ascending Placement Arrow `↗` -->
  <path d="M30 46L50 20" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M32 20H50V38" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Placement target dot -->
  <circle cx="50" cy="20" r="3" fill="#ffffff" />
</svg>