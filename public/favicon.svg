<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gpFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>
    <linearGradient id="gpFaviconGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ef763f" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#007ff5" />
    </linearGradient>
    <linearGradient id="gpFaviconArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#ef763f" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="48" height="48" rx="12" fill="url(#gpFaviconBg)" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#gpFaviconGlow)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Code Chevron `<` -->
  <path d="M19 14L10 24L19 34" stroke="url(#gpFaviconGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ascending Placement Arrow `↗` -->
  <path d="M23 33L37 17" stroke="url(#gpFaviconArrow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M25 17H37V29" stroke="url(#gpFaviconArrow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Placement node -->
  <circle cx="37" cy="17" r="2.5" fill="#ef763f" />
</svg>