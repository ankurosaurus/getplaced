<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetPlaced | No-Nonsense DSA & Placement Prep Tracker</title>
    <meta name="description" content="Stop losing your DSA progress across spreadsheets. GetPlaced tracks your placement grind across curated problem sheets with instant search, local auto-save, and zero fluff." />
    <!-- Fonts: Manrope (TakeUForward primary font), JetBrains Mono, Lexend, Josefin Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Josefin+Sans:wght@400;600;700&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        const stored = localStorage.getItem('hynts-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored === 'dark' || (!stored && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-black text-zinc-900 dark:text-zinc-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
